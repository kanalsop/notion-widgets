<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notion Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Roboto Condensed", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #74787b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px; background: transparent; }
    .clock { width: fit-content; }
    .time {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Roboto Condensed", Roboto, "Arial Narrow", sans-serif;
      font-size: clamp(64px, 17vw, 100px);
      font-weight: 800;
      line-height: .95;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
    }
    .colon { margin: 0 1px 8px 0; font-size: .68em; }
    .meta {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin: 12px 0 0;
      color: #777b7e;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #191919; color: #d4d4d4; }
      .meta { color: #a6a6a6; }
    }
  </style>
</head>
<body>
  <main class="clock" aria-label="日本時間の時計">
    <div class="time" aria-live="off">
      <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span>
    </div>
    <div class="meta"><span id="weekday">MONDAY</span></div>
  </main>
  <script>
    const formatter = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Tokyo",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23",
      weekday: "long"
    });

    function updateClock() {
      const parts = Object.fromEntries(formatter.formatToParts(new Date()).map(part => [part.type, part.value]));
      document.getElementById("hours").textContent = parts.hour;
      document.getElementById("minutes").textContent = parts.minute;
      document.getElementById("weekday").textContent = parts.weekday;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
